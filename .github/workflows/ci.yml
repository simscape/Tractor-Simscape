name: CI using MATLAB

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.svg'
      - '**.txt'
      - '**.xml'

  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '**.png'
      - '**.svg'
      - '**.txt'
      - '**.xml'

  schedule:
    - cron:  '0 3 * * 1' # schedule a weekly build (Monday 03:00 UTC)

jobs:

  job-check-project:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true
          products: |
            Simulink
            Simscape
            Simscape_Driveline
            Simscape_Fluids

      - name: Run tests
        uses: matlab-actions/run-command@v3
        with:
          command: openProject(pwd); buildtool AllTest;
